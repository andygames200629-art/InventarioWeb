<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Producto - Inventario</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS propio -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-box-seam me-2"></i>Inventario
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="bi bi-house-door me-1"></i>Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="productos.html">
                            <i class="bi bi-list-ul me-1"></i>Productos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="registrar.html">
                            <i class="bi bi-plus-circle me-1"></i>Registrar producto
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contactos.html">
                            <i class="bi bi-envelope me-1"></i>Contacto
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container mt-5">
        <h1 class="mb-4">
            <i class="bi bi-file-earmark-plus me-2"></i>Registrar Nuevo Producto
        </h1>
        <!-- FORMULARIO DE REGISTRO -->
        <div class="card p-4 mb-4 shadow-sm">
            <h2 class="mb-3">
                <i class="bi bi-pencil-square me-2"></i>Datos del Producto
            </h2>
            <!-- ✅ ID CORRECTO: formProducto -->
            <form id="formProducto">
                <!-- CÓDIGO -->
                <div class="mb-3">
                    <label for="codigo" class="form-label fw-bold">
                        <i class="bi bi-qr-code me-1"></i>Código
                    </label>
                    <input type="text" class="form-control" id="codigo" placeholder="Ej. P001" required>
                </div>
                <!-- NOMBRE -->
                <div class="mb-3">
                    <label for="nombre" class="form-label fw-bold">
                        <i class="bi bi-tags me-1"></i>Nombre del producto
                    </label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ej. Teclado" required>
                </div>
                <!-- CATEGORÍA -->
                <div class="mb-3">
                    <label for="categoria" class="form-label fw-bold">
                        <i class="bi bi-folder2-open me-1"></i>Categoría
                    </label>
                    <select class="form-select" id="categoria" required>
                        <option value="">Seleccione una categoría...</option>
                        <option value="Tecnología">💻 Tecnología</option>
                        <option value="Papelería">📝 Papelería</option>
                        <option value="Accesorios">🎀 Accesorios</option>
                    </select>
                </div>
                <!-- PRECIO -->
                <div class="mb-3">
                    <label for="precio" class="form-label fw-bold">
                        <i class="bi bi-currency-dollar me-1"></i>Precio (COP)
                    </label>
                    <input type="number" class="form-control" id="precio" min="1" step="1" placeholder="Ej. 150000" required>
                </div>
                <!-- CANTIDAD -->
                <div class="mb-4">
                    <label for="cantidad" class="form-label fw-bold">
                        <i class="bi bi-boxes me-1"></i>Cantidad en stock
                    </label>
                    <input type="number" class="form-control" id="cantidad" min="0" placeholder="Ej. 10" required>
                </div>
                <!-- BOTÓN -->
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-save me-2"></i>Guardar Producto
                </button>
            </form>
            <!-- ✅ CAJA DE MENSAJES -->
            <div id="mensaje" class="mt-3"></div>
        </div>
    </div>

    <!-- PIE DE PÁGINA -->
    <footer class="bg-primary text-white text-center p-4 mt-5">
        <p class="mb-1"><strong>José Miguel</strong> — Ficha 3233929</p>
        <p class="mb-0">Tecnólogo en Análisis y Desarrollo de Software — SENA</p>
    </footer>

    <!-- ✅ ORDEN CORRECTO: PRIMERO TU CÓDIGO, LUEGO BOOTSTRAP -->
    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
